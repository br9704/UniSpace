name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: typecheck · lint · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` runs `tsc -b` before `vite build`. Never `vite build` alone:
      # it succeeds while `tsc -b` fails, which is how three fatal defects
      # passed two separate audits (see WIRING-AUDIT.md).
      - name: Build
        run: pnpm build

      # Runs after the build on purpose. bundleBudget.test.ts and
      # index.css.test.ts assert against the real dist/ output and skip
      # themselves when it is absent — a source-level check would have passed
      # happily throughout the Tailwind outage.
      - name: Test
        run: pnpm test

<!--
  UniSpace mark: an occupancy meter inside focus brackets.

  Same geometry as the PWA icons. SIGNAL's vocabulary is brackets and block
  meters, and this app's only subject is how full a building is — so the mark is
  the thing it measures. Two bars lit amber (quiet, the state this product
  sells), two unlit steel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UniSpace">
  <rect width="64" height="64" fill="#050505"/>
  <g fill="#ffb000">
    <path d="M6 18V6h12v2.6H8.6V18z"/>
    <path d="M58 18V6H46v2.6h9.4V18z"/>
    <path d="M6 46v12h12v-2.6H8.6V46z"/>
    <path d="M58 46v12H46v-2.6h9.4V46z"/>
  </g>
  <g>
    <rect x="17" y="38" width="7" height="8"  fill="#ffb000"/>
    <rect x="26" y="32" width="7" height="14" fill="#ffb000"/>
    <rect x="35" y="26" width="7" height="20" fill="#2c2925"/>
    <rect x="44" y="20" width="7" height="26" fill="#2c2925"/>
  </g>
  <rect x="17" y="46" width="34" height="1.4" fill="#55504a"/>
</svg>
